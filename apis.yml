aid: vascular-therapies
name: Vascular Therapies
description: >-
  Vascular Therapies, Inc. is a privately held, clinical-stage biopharmaceutical
  company headquartered in Cresskill, New Jersey, developing Sirogen, a
  proprietary sirolimus formulation delivered from a bioabsorbable collagen
  implant placed perivascularly at the time of surgery. The product is aimed at
  reducing surgical stenosis and improving arteriovenous fistula maturation and
  patency in end-stage renal disease patients who need hemodialysis vascular
  access. Sirolimus for dialysis vascular access carries FDA Fast Track status
  and Orphan Drug designation in both the United States and the European Union.
  The company ran the Phase 3 ACCESS trial (243 ESRD patients across 20 US
  sites) and the multinational Phase 3 ACCESS 2 trial, whose topline results
  presented in April 2025 did not meet the primary clinical fistula maturation
  endpoint. Vascular Therapies is a therapeutics developer, not a software
  company: it ships a drug-device combination product through clinical trials
  and regulatory review, and publishes no API, SDK, developer portal or
  machine-readable contract of any kind.
